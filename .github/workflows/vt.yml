name: VT 版本协议测试
run-name: VT · ${{ inputs.case }} · ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      case:
        description: 'VT01～VT39，或 all 跑全部；写入真实 Notion'
        required: true
        default: VT01
permissions:
  contents: read
concurrency:
  group: notion-version-writes
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.select.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: 离线前置检查（不写 Notion）
        run: |
          node verify-release.mjs
          node vt/change-tests.mjs
      - id: select
        env:
          SELECTED_CASE: ${{ inputs.case }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { CASES } from './vt/all-cases.mjs'
          const selected = process.env.SELECTED_CASE
          if (selected !== 'all' && !CASES[selected]) throw new Error('无效测试编号；未启动真实测试')
          const cases = selected === 'all' ? Object.keys(CASES) : [selected]
          appendFileSync(process.env.GITHUB_OUTPUT, 'cases='+JSON.stringify(cases)+'\n')
          NODE
  test:
    name: ${{ matrix.case }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: ${{ fromJson(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: 运行 ${{ matrix.case }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CASE: ${{ matrix.case }}
        run: |
          set -o pipefail
          mkdir -p test-results
          node vt/run-vt.mjs --case "$CASE" --record | tee "test-results/$CASE.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vt-result-${{ matrix.case }}
          path: test-results/
