name: VT 版本协议测试
run-name: VT · ${{ inputs.case }} · ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      case:
        description: 'VT01～VT23，或 all；将新建测试文档并写入 v5 测试总表'
        required: true
        default: all
permissions:
  contents: read
concurrency:
  group: notion-version-writes
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: 核对交付清单与差异回归
        run: |
          node verify-release.mjs
          node vt/diff-tests.mjs
      - name: 运行选定测试并保存首轮结果
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELECTED_CASE: ${{ inputs.case }}
        run: node vt/batch.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vt-results
          path: test-results/
