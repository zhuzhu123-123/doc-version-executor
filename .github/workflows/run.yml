name: 正式运行：版本管理
run-name: 正式版本管理 · ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      doc:
        description: '文档编号；本轮验收只填新建测试文档'
        required: true
      archive:
        description: '副本存档页编号'
        required: true
      note:
        description: '已确认的本次实质修改说明；不列例行更新时间'
        required: true
      who:
        description: '具体撰写者与确认者，例如 Notion AI 撰写，朱启慧确认'
        required: true
permissions:
  contents: read
concurrency:
  group: notion-version-writes
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: 核对交付清单
        run: node verify-release.mjs
      - name: 运行执行器
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DOC: ${{ inputs.doc }}
          ARCHIVE: ${{ inputs.archive }}
          NOTE: ${{ inputs.note }}
          WHO: ${{ inputs.who }}
        run: |
          set -o pipefail
          node executor.mjs --doc "$DOC" --archive "$ARCHIVE" --note "$NOTE" --who "$WHO" | tee formal-result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-result
          path: formal-result.log
