# GitHub 上的改坏执行器检查：手动点“Run workflow”。只在模拟的 Notion 上跑，不写测试总表，不改真实页面。
name: 改坏执行器检查
on:
  workflow_dispatch:
jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: 改坏执行器检查
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node vt/mutate.mjs
